<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - Opportunity Radar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <p class="eyebrow">CAMPUS OPPORTUNITY RADAR</p>

            <h1>Student Login</h1>

            <p class="login-subtitle">
                Sign in to discover opportunities made for you.
            </p>

            <form id="userLoginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="student@campus.com"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login as Student
                </button>

            </form>

            <p id="loginMessage"></p>

            <div class="login-links">
                <a href="admin-login.html">Admin Login</a>
                <a href="index.html">Back to Explore</a>
            </div>

        </div>

    </main>

    <script src="js/user-login.js"></script>

</body>

</html>
