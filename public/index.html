<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Opportunity Radar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Opportunity<span>Radar</span>
        </div>

        <nav>
            <a href="index.html">Explore</a>
            <a href="user-login.html">Student Login</a>
            <a href="signup.html">Sign Up</a>
            <a href="admin-login.html">Admin</a>
        </nav>

    </header>


    <main class="container">

        <section class="hero">

            <div>

                <p class="eyebrow">
                    CAMPUS OPPORTUNITY RADAR
                </p>

                <h1>
                    Find opportunities<br>
                    that fit <span>you.</span>
                </h1>

                <p class="hero-text">
                    Discover internships, hackathons, workshops,
                    competitions and other campus opportunities
                    in one place.
                </p>

                <div class="hero-actions">

                    <a
                        href="signup.html"
                        class="primary-button"
                    >
                        Get Started
                    </a>

                    <a
                        href="#opportunities"
                        class="secondary-button"
                    >
                        Explore Opportunities
                    </a>

                </div>

            </div>

        </section>


        <section
            class="opportunity-section"
            id="opportunities"
        >

            <div class="section-header">

                <div>

                    <p class="eyebrow">
                        DISCOVER
                    </p>

                    <h2>
                        Latest Opportunities
                    </h2>

                </div>

                <span id="opportunityCount"></span>

            </div>


            <div class="search-area">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search opportunities..."
                >

                <select id="categoryFilter">

                    <option value="all">
                        All categories
                    </option>

                    <option value="Internship">
                        Internship
                    </option>

                    <option value="Hackathon">
                        Hackathon
                    </option>

                    <option value="Competition">
                        Competition
                    </option>

                    <option value="Workshop">
                        Workshop
                    </option>

                </select>

            </div>


            <div
                id="opportunityContainer"
                class="opportunity-grid"
            >

                <!-- Opportunities will appear here -->

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
